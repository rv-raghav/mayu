<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Warm terracotta circle background -->
  <circle cx="24" cy="24" r="24" fill="#c44b2b"/>

  <!-- Subtle radial warmth -->
  <circle cx="20" cy="20" r="18" fill="url(#glow)" opacity="0.35"/>

  <!-- Ink-brush accent stroke (diagonal) -->
  <path d="M8 40 Q14 34, 18 28 Q20 24, 22 18 Q23 14, 24 10"
        stroke="#1a1714" stroke-width="1.2" stroke-linecap="round"
        fill="none" opacity="0.12"/>

  <!-- Serif M lettermark (path-based for reliability) -->
  <path d="M12 35V15h1.5l10.5 14 10.5-14H36v20h-4V22.5L24 33.5 15.8 22.5V35z"
        fill="#f5f2ed"/>

  <!-- Small dot accent (hanko seal reference) -->
  <circle cx="37" cy="37" r="3" fill="#e8a49a" opacity="0.7"/>

  <defs>
    <radialGradient id="glow" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#e8a49a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c44b2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>